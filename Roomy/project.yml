name: Roomy
options:
  bundleIdPrefix: app.roomy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MoleCore:
    path: ../Packages/MoleCore
  Pow:
    path: ../Vendor/Pow
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Roomy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Room
        type: folder
    dependencies:
      - package: MoleCore
      - package: Pow
      - framework: ../Vendor/Sparkle/Sparkle.framework
        embed: true
      - target: roomy-fan
        embed: true
        copy:
          destination: executables
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Roomy
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "101"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "GPL-3.0. Built on PureMac (MIT) and Mole (GPL-3.0)."
        SUFeedURL: https://github.com/dibyajyotiron/roomy/releases/latest/download/appcast.xml
        SUPublicEDKey: KmDoLhHTW4ettZXyEMZMFjgPk3i01x0RFYzE+unlrtg=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUAllowsAutomaticUpdates: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableSystemProfiling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roomy.Roomy
        PRODUCT_NAME: Roomy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  roomy-fan:
    type: tool
    platform: macOS
    sources:
      - path: Helper
      - path: Sources/Engine/SMC.swift
    settings:
      base:
        PRODUCT_NAME: roomy-fan
