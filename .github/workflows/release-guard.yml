name: Release audit

# Post-publication detection only. It cannot prevent clients seeing a release.
# Actual publishing must validate artifacts and exact-commit CI while the release is still a draft.
on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  guard:
    name: Audit the published release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact-commit build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Invalid release tag"; exit 1 ;; esac
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          python3 -I scripts/release-validation.py ci "$sha"
