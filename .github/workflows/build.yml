name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The build only reads the repository. Pull requests from forks never see secrets (there are none) and can't write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roomy:
    name: Build Roomy
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs; Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the Mole version Roomy is pinned to
        run: scripts/fetch-mole.sh "$RUNNER_TEMP/mole/$(cat MOLE_VERSION)"
      - name: Check safety with isolated fixtures
        run: |
          Packages/MoleCore/Tools/check.sh
          sh scripts/check-security.sh
      - name: Build and package
        run: MOLE_HOME="$RUNNER_TEMP/mole/$(cat MOLE_VERSION)" Roomy/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Roomy-${{ github.sha }}
          path: dist/*
          retention-days: 14
